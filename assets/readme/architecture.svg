<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="archTitle archDesc">
  <title id="archTitle">How switching works</title>
  <desc id="archDesc">Two reliable paths and one bypassed path. Per-IME shortcuts go through the KeyboardShortcuts Carbon hotkey to the TIS switching engine with read-back verification. The global toggle goes through a CGEventTap that consumes the chord, a HotkeyEventRouter and a HotkeyToggleEngine before the same TIS switch. The system input source hotkey path, which reverts switches, is bypassed entirely.</desc>
  <defs>
    <linearGradient id="capAccent" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#79B7F2"/>
      <stop offset="1" stop-color="#4A90DE"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="620" rx="28" fill="#F7F1E3"/>

  <text x="72" y="66" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" letter-spacing="3" fill="#2E77C8" opacity="0.9">HOW SWITCHING WORKS</text>
  <text x="72" y="104" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="26" font-weight="600" fill="#2B303A">Two reliable switching paths</text>

  <!-- Lane 1: per-IME shortcuts -->
  <g>
    <text x="72" y="164" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" letter-spacing="2" fill="#555D6B">PER-IME SHORTCUTS</text>

    <rect x="72" y="180" width="272" height="80" rx="14" fill="#FFFDF6" stroke="#D8D0BD" stroke-width="2"/>
    <text x="208" y="216" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="21" font-weight="600" fill="#23272E">KeyboardShortcuts</text>
    <text x="208" y="244" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#8B8474">Carbon global hotkey</text>

    <line x1="344" y1="220" x2="370" y2="220" stroke="#8C8472" stroke-width="2.5"/>
    <polygon points="384,220 368,213 368,227" fill="#8C8472"/>

    <rect x="384" y="180" width="272" height="80" rx="14" fill="#FFFDF6" stroke="#D8D0BD" stroke-width="2"/>
    <text x="520" y="216" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="21" font-weight="600" fill="#23272E">InputSourceSwitcher</text>
    <text x="520" y="244" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#8B8474">TISSelectInputSource</text>

    <line x1="656" y1="220" x2="682" y2="220" stroke="#8C8472" stroke-width="2.5"/>
    <polygon points="696,220 680,213 680,227" fill="#8C8472"/>

    <rect x="696" y="180" width="272" height="80" rx="14" fill="#FFFDF6" stroke="#D8D0BD" stroke-width="2"/>
    <text x="832" y="216" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="21" font-weight="600" fill="#23272E">Verify + focus nudge</text>
    <text x="832" y="244" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#8B8474">read-back check</text>

    <line x1="968" y1="220" x2="994" y2="220" stroke="#8C8472" stroke-width="2.5"/>
    <polygon points="1008,220 992,213 992,227" fill="#8C8472"/>

    <rect x="1008" y="178" width="84" height="84" rx="20" fill="url(#capAccent)" stroke="#B7D7FF" stroke-opacity="0.5" stroke-width="2"/>
    <text x="1050" y="232" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Apple SD Gothic Neo', sans-serif" font-size="36" font-weight="600" fill="#10141C">가</text>
  </g>

  <!-- Lane 2: global toggle -->
  <g>
    <text x="72" y="304" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" letter-spacing="2" fill="#555D6B">GLOBAL TOGGLE — TAP/HOLD CHORD</text>

    <rect x="72" y="320" width="272" height="80" rx="14" fill="#FFFDF6" stroke="#D8D0BD" stroke-width="2"/>
    <text x="208" y="356" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="21" font-weight="600" fill="#23272E">KeyboardShortcuts</text>
    <text x="208" y="384" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#8B8474">chord + ⇧ reverse</text>

    <line x1="344" y1="360" x2="370" y2="360" stroke="#8C8472" stroke-width="2.5"/>
    <polygon points="384,360 368,353 368,367" fill="#8C8472"/>

    <rect x="384" y="320" width="272" height="80" rx="14" fill="#FFFDF6" stroke="#D8D0BD" stroke-width="2"/>
    <text x="520" y="356" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="21" font-weight="600" fill="#23272E">InputSourceToggleEngine</text>
    <text x="520" y="384" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#8B8474">tap · hold · MRU</text>

    <line x1="656" y1="360" x2="682" y2="360" stroke="#8C8472" stroke-width="2.5"/>
    <polygon points="696,360 680,353 680,367" fill="#8C8472"/>

    <rect x="696" y="320" width="272" height="80" rx="14" fill="#FFFDF6" stroke="#D8D0BD" stroke-width="2"/>
    <text x="832" y="356" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="21" font-weight="600" fill="#23272E">InputSourceSwitcher</text>
    <text x="832" y="384" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#8B8474">tap · hold · MRU</text>

    <line x1="968" y1="360" x2="994" y2="360" stroke="#8C8472" stroke-width="2.5"/>
    <polygon points="1008,360 992,353 992,367" fill="#8C8472"/>

    <rect x="1008" y="318" width="128" height="84" rx="20" fill="#FFFDF6" stroke="#D8D0BD" stroke-width="2"/>
    <text x="1072" y="372" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Apple SD Gothic Neo', sans-serif" font-size="28" font-weight="600" fill="#2B303A">가 ⇄ A</text>
  </g>

  <!-- Lane 3: separate system path -->
  <g>
    <text x="72" y="444" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" letter-spacing="2" fill="#555D6B">SYSTEM HOTKEY PATH — SEPARATE</text>

    <rect x="72" y="460" width="584" height="80" rx="14" fill="#F2ECDC" stroke="#D8D0BD" stroke-width="2" stroke-dasharray="7 5"/>
    <text x="364" y="496" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="21" font-weight="600" fill="#555D6B">macOS input source hotkey</text>
    <text x="364" y="524" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#8B8474">outside SwitchIM — keeps working</text>

    <text x="696" y="496" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#8B8474">the toggle chord is separate, so —</text>
    <text x="696" y="524" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#8B8474">the two never collide</text>
  </g>

  <text x="72" y="584" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#8B8474">All switching goes through TIS with read-back verification.</text>
</svg>
